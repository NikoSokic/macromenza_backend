server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none      
spring.jpa.show-sql=${SHOW_SQL:false}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.jpa.open-in-view=false
# Korak 16: prepoznavanje obroka (Gemini); kljuc dolazi iz backend/.env ili env varijable GEMINI_API_KEY
spring.config.import=optional:file:.env[.properties]
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=9MB

# Korak 19: tokene izdaje Supabase Auth; potpis se provjerava javnim JWKS-om projekta (nema tajne)
supabase.url=${SUPABASE_URL:https://nncjmtrxderijntybnhb.supabase.co}
